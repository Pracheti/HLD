# --------------------------------------------------
# Spring Boot server configuration
# --------------------------------------------------

# Run the backend on port 8080
server.port=8080


# --------------------------------------------------
# PostgreSQL database configuration
# --------------------------------------------------

# Database connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/livecounter

# Database username
spring.datasource.username=counteruser

# Database password
spring.datasource.password=counterpass

# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver


# --------------------------------------------------
# JPA and Hibernate configuration
# --------------------------------------------------

# Automatically update database tables based on Java entities
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in the console
spring.jpa.show-sql=true

# Use UTC as the application's Hibernate JDBC timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC